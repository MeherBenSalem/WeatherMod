# Important notes:
# fabric.mod.json's id field cannot be expanded, it is written out by hand.
# Every property added here that a resource file needs must also be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=1.0.0
group=dev.livingworld
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Living World
mod_author=Living World contributors
mod_id=livingworld
license=MIT
credits=
description=An environmental realism engine: climate, wind, layered weather, footprints, atmosphere and procedural ambience that make every biome feel alive.
minecraft_version_range=[1.20.1, 1.20.2)
# ParchmentMC parameter names, see https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric (see https://fabricmc.net/develop)
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.14
# Optional integrations (compile-only)
modmenu_version=7.2.2
# Compiled against, and used by the compatibility smoke tests (gradlew :fabric:runAutotest -PlwCompat=sodium,iris)
sodium_version=mc1.20.1-0.5.11
iris_version=1.7.2+1.20.1

# Forge
forge_version=47.4.10
forge_version_range=[47.2.0,)
forge_loader_version_range=[47,)
# Compiled against, and used by the compatibility smoke tests (gradlew :forge:runAutotest -PlwCompat=embeddium,oculus)
embeddium_version=0.3.31+mc1.20.1
oculus_version=1.20.1-1.8.0

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
